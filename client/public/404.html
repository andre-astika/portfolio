<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andre Astika — Portfolio</title>
  </head>
  <body>
    <script>
      (function () {
        var base = "/portfolio";
        var route = window.location.pathname.indexOf(base) === 0
          ? window.location.pathname.slice(base.length)
          : window.location.pathname;
        if (/^\/blog-[1-3]\/?$/.test(route)) {
          window.location.replace(base + "/?p=" + encodeURIComponent(route.replace(/\/$/, "")));
          return;
        }
        window.location.replace(base + "/");
      })();
    </script>
  </body>
</html>
